<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <title>Nõmme ajalooline kaart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      background: #f5f5f5;
    }

    .sidebar {
      width: 360px;
      background: #ffffff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #eee;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .sidebar-header h1 {
      margin: 0 0 12px 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .sidebar-header p {
      margin: 0 0 12px 0;
      color: #555;
      font-size: 14px;
      line-height: 1.4;
    }

    .search-box,
    .filter-box {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
    }

    .stats {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .places-list {
      overflow-y: auto;
      padding: 10px;
      flex: 1;
    }

    .place-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .place-card:hover {
      background: #f8f8f8;
      border-color: #cfcfcf;
    }

    .place-card h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
      line-height: 1.3;
    }

    .place-card .meta {
      display: inline-block;
      font-size: 12px;
      color: #2d5b8a;
      background: #eef5fb;
      border-radius: 999px;
      padding: 4px 8px;
      margin-bottom: 8px;
    }

    .place-card p {
      margin: 0;
      font-size: 13px;
      color: #555;
      line-height: 1.45;
    }

    .map-wrap {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .map-topbar {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      font-size: 14px;
      line-height: 1.4;
      max-width: 300px;
    }

    .popup-content {
      width: 240px;
    }

    .popup-content img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
      display: block;
    }

    .popup-content h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
      line-height: 1.3;
    }

    .popup-content p {
      margin: 0 0 8px 0;
      font-size: 13px;
      line-height: 1.45;
      color: #444;
    }

    .popup-tag {
      display: inline-block;
      font-size: 12px;
      color: #2d5b8a;
      background: #eef5fb;
      border-radius: 999px;
      padding: 4px 8px;
    }

    .empty-state {
      padding: 20px;
      color: #666;
      font-size: 14px;
    }

    .mobile-toggle {
      display: none;
    }

    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 45vh;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }

      .map-wrap {
        height: 55vh;
      }

      #map {
        height: 55vh;
      }

      .map-topbar {
        max-width: calc(100% - 24px);
      }
    }
  </style>
</head>
<body>

    <div class="sidebar-header">
      <h1>Nõmme ajalooline kaart</h1>
      <p>Nõmme ajaloolised, miljööväärtuslikud ja tuntud paigad ühel kaardil.</p>

      <input
        id="searchInput"

        type="text"
        placeholder="Otsi koha nime või aadressi järgi"

      <select id="filterSelect" class="filter-box">

        <option value="landmark">Tuntud kohad</option>
        <option value="station">Raudteejaamad</option>
        <option value="nature">Loodus</option>
        <option value="church">Pühakojad</option>
        <option value="cemetery">Kalmistud</option>

        <option value="culture">Kultuur</option>
        <option value="miljoo">Miljööväärtuslikud objektid</option>

      <div class="stats" id="statsText">Laadin kohti...</div>
    </div>

    <div class="places-list" id="placesList"></div>
  </aside>

  <main class="map-wrap">

      <strong>Versioon 2</strong><br />

    </div>
    <div id="map"></div>
  </main>

{

{

  query: "Näituse 23, Tallinn, Estonia",
  shortText: "Ajalooline villa, kasutatud riigi residentsina nõukogude ajal.",
  image: "",

},
{
  id: "paneelmajad-klaster",
  name: "Paneelmajade klaster (Valdeku–Pihlaka)",
  query: "Valdeku tn ja Pihlaka tn, Tallinn, Estonia",

      {

      "Raudtee tn 60a", "Pärnu mnt 540a", "Pärnu mnt 406", "Raudtee tn 73", "Turu plats 4", "Läänekaare tn 3",

      "Sinilille tn 7", "Suvila 42", "Kraavi tn 47", "Läike tn 14", "Hommiku tn 2 / Lauliku tn 4f",
      "Kalmistu tee 2a", "Valguse 8", "Toome pst 5", "Ränduri tn 18", "Trummi tn 15", "Pärja tn 58",
      "Kadaka pst 84", "Harku tn 36", "Lauliku tn 5", "Metsa tn 21", "Metsa tn 30", "Põllu tn 63",
      "Sihi tn 98", "Sihi tn 119", "Raudtee tn 97", "Vabaduse pst 88", "Vabaduse pst 90", "Valdeku tn 39",
      "Valdeku tn 77", "Pärnu mnt 326", "Pärnu mnt 328", "Männiku tee 22", "Männiku tee 90", "Nurme tn 54",

    const addressPlaces = addressList.map((address, index) => ({
      id: "miljoo-" + index,
      name: address,
      query: `${address}, Nõmme, Tallinn, Estonia`,
      shortText: "Miljööväärtuslik või ajalooliselt oluline objekt Nõmmel.",
      image: "",
      category: "miljoo"
    }));

    const places = [...featuredPlaces, ...addressPlaces];

    const categoryNames = {
      landmark: "Tuntud koht",
      station: "Raudteejaam",
      nature: "Loodus",
      church: "Pühakoda",
      cemetery: "Kalmistu",
      sport: "Sport",
      culture: "Kultuur",
      miljoo: "Miljööväärtuslik objekt"
    };

    const markersLayer = L.layerGroup().addTo(map);
    const markersById = new Map();
    const loadedPlaces = [];

    const placesList = document.getElementById("placesList");
    const searchInput = document.getElementById("searchInput");
    const filterSelect = document.getElementById("filterSelect");
    const statsText = document.getElementById("statsText");

    function popupHtml(place) {
      const imageHtml = place.image
        ? `<img src="${place.image}" alt="${place.name}">`
        : "";

      return `
        <div class="popup-content">
          ${imageHtml}
          <h3>${place.name}</h3>
          <p>${place.shortText}</p>
          <span class="popup-tag">${categoryNames[place.category] || "Koht"}</span>
        </div>
      `;
    }

    function getCacheKey(query) {
      return "nomme-geocode-v2:" + query;
    }

    async function geocode(query) {
      const cacheKey = getCacheKey(query);
      const cached = localStorage.getItem(cacheKey);
      if (cached) {
        try {
          return JSON.parse(cached);
        } catch (e) {
          localStorage.removeItem(cacheKey);
        }
      }

      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;

      const res = await fetch(url, {
        headers: {
          "Accept-Language": "et"
        }
      });

      const data = await res.json();
      if (!data || !data.length) return null;

      const result = {
        lat: parseFloat(data[0].lat),
        lon: parseFloat(data[0].lon)
      };

      localStorage.setItem(cacheKey, JSON.stringify(result));
      return result;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function renderList() {
      const term = searchInput.value.trim().toLowerCase();
      const filter = filterSelect.value;

      const filtered = loadedPlaces.filter(place => {
        const matchesSearch =
          place.name.toLowerCase().includes(term) ||
          place.query.toLowerCase().includes(term) ||
          place.shortText.toLowerCase().includes(term);

        const matchesFilter = filter === "all" || place.category === filter;
        return matchesSearch && matchesFilter;
      });

      statsText.textContent = `Kokku laaditud: ${loadedPlaces.length}. Näitan: ${filtered.length}.`;

      if (!filtered.length) {
        placesList.innerHTML = `<div class="empty-state">Ühtegi sobivat kohta ei leitud.</div>`;
        return;
      }

      placesList.innerHTML = filtered.map(place => `
        <div class="place-card" data-id="${place.id}">
          <div class="meta">${categoryNames[place.category] || "Koht"}</div>
          <h3>${place.name}</h3>
          <p>${place.shortText}</p>
        </div>
      `).join("");

      document.querySelectorAll(".place-card").forEach(card => {
        card.addEventListener("click", () => {
          const id = card.dataset.id;
          const marker = markersById.get(id);
          const place = loadedPlaces.find(p => p.id === id);

          if (marker && place) {
            map.setView([place.lat, place.lon], 17, { animate: true });
            marker.openPopup();
          }
        });
      });
    }

    function updateMapVisibility() {
      const term = searchInput.value.trim().toLowerCase();
      const filter = filterSelect.value;

      markersLayer.clearLayers();

      const visible = loadedPlaces.filter(place => {
        const matchesSearch =
          place.name.toLowerCase().includes(term) ||
          place.query.toLowerCase().includes(term) ||
          place.shortText.toLowerCase().includes(term);

        const matchesFilter = filter === "all" || place.category === filter;
        return matchesSearch && matchesFilter;
      });

      visible.forEach(place => {
        const marker = markersById.get(place.id);
        if (marker) {
          markersLayer.addLayer(marker);
        }
      });
    }

    function refreshUI() {
      renderList();
      updateMapVisibility();
    }

    searchInput.addEventListener("input", refreshUI);
    filterSelect.addEventListener("change", refreshUI);

    async function loadPlaces() {
      const bounds = [];

      for (const place of places) {
        try {
          const point = await geocode(place.query);
          if (!point) continue;

          place.lat = point.lat;
          place.lon = point.lon;

          const marker = L.marker([point.lat, point.lon]).bindPopup(popupHtml(place));
          markersById.set(place.id, marker);
          loadedPlaces.push(place);
          bounds.push([point.lat, point.lon]);

          refreshUI();
          await sleep(250);
        } catch (e) {
          console.warn("Geokodeerimine ebaõnnestus:", place.name, e);
        }
      }

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [30, 30] });
      }

      refreshUI();
    }

    loadPlaces();
  </script>
</body>
</html>
