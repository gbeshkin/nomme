<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <title>Nõmme ajalooline kaart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌲</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    body {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 370px;
      background: #fff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #eee;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .sidebar-header h1 {
      margin: 0 0 10px 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .sidebar-header p {
      margin: 0 0 12px 0;
      color: #555;
      font-size: 14px;
      line-height: 1.45;
    }

    .search-box,
    .filter-box {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
    }

    .stats {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .places-list {
      overflow-y: auto;
      padding: 10px;
      flex: 1;
    }

    .place-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .place-card:hover {
      background: #f8f8f8;
      border-color: #cfcfcf;
      transform: translateY(-1px);
    }

    .place-card h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
      line-height: 1.3;
    }

    .place-card .meta {
      display: inline-block;
      font-size: 12px;
      color: #2d5b8a;
      background: #eef5fb;
      border-radius: 999px;
      padding: 4px 8px;
      margin-bottom: 8px;
    }

    .place-card p {
      margin: 0;
      font-size: 13px;
      color: #555;
      line-height: 1.45;
    }

    .map-wrap {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .map-topbar {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      font-size: 14px;
      line-height: 1.4;
      max-width: 320px;
    }

    .popup-content {
      width: 240px;
    }

    .popup-content img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
      display: block;
    }

    .popup-content h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
      line-height: 1.3;
    }

    .popup-content p {
      margin: 0 0 8px 0;
      font-size: 13px;
      line-height: 1.45;
      color: #444;
    }

    .popup-tag {
      display: inline-block;
      font-size: 12px;
      color: #2d5b8a;
      background: #eef5fb;
      border-radius: 999px;
      padding: 4px 8px;
    }

    .empty-state {
      padding: 20px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 46vh;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }

      .map-wrap {
        height: 54vh;
      }

      #map {
        height: 54vh;
      }

      .map-topbar {
        max-width: calc(100% - 24px);
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Nõmme ajalooline kaart</h1>
      <p>Nõmme ajaloolised, linnaloolised ja miljööväärtuslikud kohad ühel kaardil.</p>

      <input
        id="searchInput"
        class="search-box"
        type="text"
        placeholder="Otsi nime, aadressi või märksõna järgi"
      />

      <select id="filterSelect" class="filter-box">
        <option value="all">Kõik kategooriad</option>
        <option value="landmark">Tuntud kohad</option>
        <option value="station">Raudtee / ühendused</option>
        <option value="nature">Loodus</option>
        <option value="church">Pühakojad</option>
        <option value="cemetery">Kalmistud</option>
        <option value="sport">Sport</option>
        <option value="culture">Kultuur / ajalugu</option>
        <option value="soviet">Nõukogude pärand</option>
        <option value="miljoo">Miljöö / arhitektuur</option>
      </select>

      <div class="stats" id="statsText">Laadin kohti…</div>
    </div>

    <div class="places-list" id="placesList"></div>
  </aside>

  <main class="map-wrap">
    <div class="map-topbar">
      <strong>Nõmme v2</strong><br />
      Staatilised koordinaadid, otsing, filtrid ja popup-id.
    </div>
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([59.385, 24.677], 13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {

    const categoryNames = {

      church: "Pühakoda",
      cemetery: "Kalmistu",
      sport: "Sport",
      culture: "Kultuur / ajalugu",

        image: "https://visitestonia.com/images/3316958/_DSF9546.jpg",

      },
      {
        id: "nomme-raudteejaam",

        lat: 59.38905,
        lon: 24.68575,
        shortText: "Jaam, mille ümber hakkas Nõmme kujunema.",
        image: "https://upload.wikimedia.org/wikipedia/commons/9/95/N%C3%B5mme_railway_station_2024.jpg",
        category: "station",

      },
      {

        image: "https://live.s3.teliahybridcloud.com/s3fs-public/image_bank_foto/2023-01/N%C3%B5mme%20muuseum.jpg",
        category: "culture",

      },
      {

        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/N6mme_rahu_kirik_2007_veebruar.jpg/960px-N6mme_rahu_kirik_2007_veebruar.jpg",
        category: "church",
        address: "Õie tn 10"
      },
      {
        id: "rahumae-kalmistu",

        lat: 59.38180,

        shortText: "Ajalooline kalmistu ja oluline mälupaik Nõmme serval.",
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Rahum%C3%A4e_kalmistu_peav%C3%A4rav.jpg/960px-Rahum%C3%A4e_kalmistu_peav%C3%A4rav.jpg",
        category: "cemetery",
        address: "Kalmistu tee"
      },
      {
        id: "nomme-mustamae",

        lat: 59.39650,
        lon: 24.65950,
        shortText: "Metsane maastikuala, kus kohtuvad loodus ja linnaajalugu.",
        image: "",

        address: "Nõmme-Mustamäe"
      },
      {
        id: "glehni-allikas",
        name: "Glehni allikas",
        lat: 59.38710,
        lon: 24.65295,
        shortText: "Looduslik allikas ajaloolise Glehni ümbruse lähedal.",
        image: "",
        category: "nature",
        address: "Glehni park"
      },
      {
        id: "hiiu-jaam",
        name: "Hiiu raudteejaam",
        lat: 59.38185,
        lon: 24.66890,
        shortText: "Ajalooline peatus Nõmme arenguloos.",
        image: "",
        category: "station",
        address: "Hiiu"
      },
      {
        id: "kivimae-jaam",
        name: "Kivimäe raudteejaam",
        lat: 59.37620,
        lon: 24.69860,
        shortText: "Ajalooline jaam Nõmme piirkonnas.",

      },
      {

        lon: 24.64660,
        shortText: "Oluline peatus läänepoolsel Nõmmel.",
        image: "",
        category: "station",

      },
      {

        name: "Liiva raudteejaam",
        lat: 59.37070,
        lon: 24.72000,
        shortText: "Ajaloolise Nõmme piirkonna oluline ühenduskoht.",
        image: "",
        category: "station",
        address: "Liiva"
      },

      {
        id: "hiiu-elevaator",
        name: "Hiiu viljaelevaator",
        lat: 59.38120,
        lon: 24.66120,
        shortText: "1950. aastate tööstuslik maamärk Nõmmel.",
        image: "",
        category: "landmark",
        address: "Hiiu piirkond"
      },
      {
        id: "ema-lapse-kodu-hiiul",
        name: "Ema ja lapse kodu Hiiul",
        lat: 59.38250,
        lon: 24.66600,
        shortText: "Endine pansionaat, oluline sotsiaalajalooline objekt.",
        image: "",

        address: "Hiiu piirkond"
      },
      {
        id: "rahumae-viadukt",
        name: "Rahumäe viadukt",
        lat: 59.39050,
        lon: 24.71000,
        shortText: "Endise kitsarööpmelise raudtee viadukt, tänapäeval jalakäijate kasutuses.",
        image: "",
        category: "station",
        address: "Rahumäe"
      },
      {
        id: "mustamae-suusahuppemagi",
        name: "Mustamäe suusahüppemägi",
        lat: 59.39850,
        lon: 24.66250,
        shortText: "Ajalooline spordirajatis ja tuntud maastikuobjekt Nõmme serval.",
        image: "",
        category: "sport",
        address: "Mustamäe / Nõmme piir"
      },
      {
        id: "kivimae-saun",
        name: "Kivimäe saunakompleks",
        lat: 59.37540,
        lon: 24.69950,
        shortText: "Endine saunakompleks, oluline osa kohaliku kogukonna elust.",
        image: "",
        category: "culture",
        address: "Kivimäe"
      },
      {
        id: "paaskyla-suvila",
        name: "Pääsküla suvilakompleks",
        lat: 59.35680,
        lon: 24.63750,
        shortText: "Endine Peeter Suure merekindluse juhtkonna suveresidents.",
        image: "",
        category: "landmark",
        address: "Pärnu mnt 492"
      },
      {
        id: "tiidemanni-villa",
        name: "Tiidemanni villa",
        lat: 59.36680,
        lon: 24.67020,
        shortText: "Ajalooline villa, mida kasutati riikliku residentsina nõukogude ajal.",
        image: "",
        category: "landmark",
        address: "Näituse 23"
      },
      {
        id: "valdeku-pihlaka-panel",
        name: "Paneelmajade klaster Valdeku–Pihlaka",
        lat: 59.37020,
        lon: 24.70780,
        shortText: "Nõukogudeaegne paneelmajade ala Nõmme ja Mustamäe serval.",
        image: "",
        category: "soviet",
        address: "Valdeku tn / Pihlaka tn ümbrus"
      },

      {
        id: "nomme-maja",
        name: "Nõmme Maja",
        lat: 59.38390,
        lon: 24.70030,
        shortText: "Kohaliku kultuuriloo jaoks oluline hoone.",
        image: "",
        category: "culture",
        address: "Valdeku 13"
      },
      {
        id: "nurme-residents",
        name: "Nurme residents",
        lat: 59.38840,
        lon: 24.68090,
        shortText: "Esinduslik ajalooline villa Nõmme keskuse lähedal.",
        image: "",
        category: "miljoo",
        address: "Nurme 47"
      },
      {
        id: "vana-paaskyla",
        name: "Pääsküla ajalooline ala",
        lat: 59.35120,
        lon: 24.64120,
        shortText: "Läänepoolse Nõmme ajalooline ja miljööväärtuslik piirkond.",
        image: "",
        category: "miljoo",
        address: "Pääsküla"
      },
      {
        id: "nomme-keskuse-villad",
        name: "Nõmme keskuse villade piirkond",
        lat: 59.38790,
        lon: 24.68250,
        shortText: "Puitvillad ja madal hoonestus, mis annavad Nõmmele iseloomuliku ilme.",
        image: "",
        category: "miljoo",
        address: "Nõmme keskuse ümbrus"
      },
      {
        id: "hiiu-eraelamud",
        name: "Hiiu ajalooline eramupiirkond",
        lat: 59.38110,
        lon: 24.67120,
        shortText: "Rahulik villade ja aedade piirkond, mis peegeldab Nõmme arengut.",
        image: "",
        category: "miljoo",
        address: "Hiiu"
      },
      {
        id: "kivimae-eraelamud",
        name: "Kivimäe ajalooline eramupiirkond",
        lat: 59.37580,
        lon: 24.70120,
        shortText: "Miljööväärtuslik ala, kus on säilinud Nõmmele omane madal hoonestus.",
        image: "",
        category: "miljoo",
        address: "Kivimäe"
      }
    ];

    const placesList = document.getElementById("placesList");
    const searchInput = document.getElementById("searchInput");
    const filterSelect = document.getElementById("filterSelect");
    const statsText = document.getElementById("statsText");

    const markersLayer = L.layerGroup().addTo(map);
    const markersById = new Map();

    function popupHtml(place) {
      const imageHtml = place.image
        ? `<img src="${place.image}" alt="${place.name}">`
        : "";

      const addressHtml = place.address
        ? `<p><strong>Aadress:</strong> ${place.address}</p>`
        : "";

      return `
        <div class="popup-content">
          ${imageHtml}
          <h3>${place.name}</h3>
          <p>${place.shortText}</p>
          ${addressHtml}
          <span class="popup-tag">${categoryNames[place.category] || "Koht"}</span>
        </div>
      `;
    }

    function createMarker(place) {
      const marker = L.marker([place.lat, place.lon]).bindPopup(popupHtml(place));
      markersById.set(place.id, marker);
      return marker;
    }

    function getFilteredPlaces() {
      const term = searchInput.value.trim().toLowerCase();
      const filter = filterSelect.value;

      return places.filter(place => {
        const haystack = [
          place.name,
          place.shortText,
          place.address || "",
          categoryNames[place.category] || ""
        ].join(" ").toLowerCase();

        const matchesSearch = haystack.includes(term);
        const matchesFilter = filter === "all" || place.category === filter;
        return matchesSearch && matchesFilter;
      });
    }

    function renderList(filtered) {
      statsText.textContent = `Kokku: ${places.length}. Näitan: ${filtered.length}.`;

      if (!filtered.length) {
        placesList.innerHTML = `<div class="empty-state">Ühtegi sobivat kohta ei leitud.</div>`;
        return;
      }

      placesList.innerHTML = filtered.map(place => `
        <div class="place-card" data-id="${place.id}">
          <div class="meta">${categoryNames[place.category] || "Koht"}</div>
          <h3>${place.name}</h3>
          <p>${place.shortText}</p>
        </div>
      `).join("");

      document.querySelectorAll(".place-card").forEach(card => {
        card.addEventListener("click", () => {
          const id = card.dataset.id;
          const place = places.find(p => p.id === id);
          const marker = markersById.get(id);

          if (place && marker) {
            map.setView([place.lat, place.lon], 16, { animate: true });
            marker.openPopup();
          }
        });
      });
    }

    function renderMarkers(filtered) {
      markersLayer.clearLayers();

      filtered.forEach(place => {
        let marker = markersById.get(place.id);
        if (!marker) {
          marker = createMarker(place);
        }
        markersLayer.addLayer(marker);
      });
    }

    function refreshUI() {
      const filtered = getFilteredPlaces();
      renderList(filtered);
      renderMarkers(filtered);

      if (filtered.length) {
        const bounds = filtered.map(place => [place.lat, place.lon]);
        map.fitBounds(bounds, { padding: [30, 30] });
      } else {
        map.setView([59.385, 24.677], 13);
      }
    }

    searchInput.addEventListener("input", refreshUI);
    filterSelect.addEventListener("change", refreshUI);

    refreshUI();
  </script>
</body>
</html>
