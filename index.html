  const places = [...featuredPlaces, ...addressPlaces];

  const markerCluster = L.layerGroup().addTo(map);
  const bounds = [];

  function popupHtml(place) {
    const imageHtml = place.image
      ? `<img src="${place.image}" alt="${place.name}" style="width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px;">`
      : "";

    return `
      <div style="width:220px;">
        ${imageHtml}
        <h3 style="margin:0 0 6px 0;font-size:16px;">${place.name}</h3>
        <p style="margin:0;font-size:13px;line-height:1.4;">${place.shortText}</p>
      </div>
    `;
  }

  async function geocode(query) {
    const cacheKey = `nomme-geocode:${query}`;
    const cached = localStorage.getItem(cacheKey);
    if (cached) return JSON.parse(cached);

    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
    const res = await fetch(url, {
      headers: { "Accept-Language": "et" }
    });
    const data = await res.json();

    if (!data || !data.length) return null;

    const result = {
      lat: parseFloat(data[0].lat),
      lon: parseFloat(data[0].lon)
    };

    localStorage.setItem(cacheKey, JSON.stringify(result));
    return result;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function addPlaces() {
    for (const place of places) {
      try {
        const point = await geocode(place.query);
        if (!point) continue;

        const marker = L.marker([point.lat, point.lon]).addTo(markerCluster);
        marker.bindPopup(popupHtml(place));
        bounds.push([point.lat, point.lon]);

        await sleep(350);
      } catch (e) {
        console.warn("Ei õnnestunud geokodeerida:", place.name, e);
      }
    }

    if (bounds.length) {
      map.fitBounds(bounds, { padding: [30, 30] });
    }
  }

  addPlaces();
